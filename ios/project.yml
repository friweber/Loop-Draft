name: LoopDraft
options:
  bundleIdPrefix: com.loopdraft
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    GCC_OPTIMIZATION_LEVEL: "2"
targets:
  LoopDraft:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LoopDraft
      - path: ../engine/src
        excludes:
          - "**/*.h"
          - "**/*.inc"
      # the presets, drum kits and grooves, as a folder "library" inside the app
      - path: ../content/library
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdraft.app
        INFOPLIST_FILE: LoopDraft/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: LoopDraft/Bridge/LoopDraft-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../engine/include"
          - "$(PROJECT_DIR)/../engine/third_party"
          - "$(PROJECT_DIR)/LoopDraft/Bridge"
        OTHER_CPLUSPLUSFLAGS:
          - "-O3"
          - "-fno-math-errno"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: AVFAudio.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
