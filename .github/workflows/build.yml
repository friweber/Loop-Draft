name: Build

on:
  push:
    branches: [main, android-app]
    paths: ['engine/**', 'android/**', 'ios/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j 4
          ./engine/build/ld_tests
      - name: Test again with memory checks
        run: |
          cmake -S engine -B engine/build-asan -DLD_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build engine/build-asan -j 4
          ./engine/build-asan/ld_tests

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LoopDraft.apk
      - name: Check the APK
        run: bash android/ci/check_apk.sh LoopDraft.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LoopDraft-apk
          path: LoopDraft.apk

  ios:
    name: iOS / iPadOS IPA (SideStore)
    runs-on: macos-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned iOS app (iPhone + iPad)
        run: |
          xcodebuild \
            -project ios/LoopDraft.xcodeproj \
            -scheme LoopDraft \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA for SideStore / Sideloadly
        run: |
          mkdir -p ios/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/LoopDraft.app ios/Payload/
          (cd ios && zip -qr ../LoopDraft-iOS-SideStore.ipa Payload)
          ls -lh LoopDraft-iOS-SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LoopDraft-ipa
          path: LoopDraft-iOS-SideStore.ipa

  smoke:
    name: Run the app on an emulator
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LoopDraft-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app and watch it play
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/smoke.sh LoopDraft.apk smoke-out
      - name: Keep screenshots and log (branch ci-smoke)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-out && cd smoke-out
          echo "Smoke test output of run ${{ github.run_number }} (${{ github.sha }})" > README.md
          git init -q && git checkout -q -b ci-smoke && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Smoke test output, run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke

  publish:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: [smoke, ios]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LoopDraft-apk
      - uses: actions/download-artifact@v4
        with:
          name: LoopDraft-ipa
      - name: Publish as "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest LoopDraft.apk LoopDraft-iOS-SideStore.ipa --latest --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built automatically from main. Android: install LoopDraft.apk. iPhone/iPad: install LoopDraft-iOS-SideStore.ipa via SideStore or Sideloadly."
