name: Build

on:
  push:
    branches: [main, ios-0.11]
    paths: ['engine/**', 'android/**', 'ios/**', 'content/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j 4
          ./engine/build/ld_tests
      - name: Check every preset and groove in content/
        run: ./engine/build/ld_content check $(find content -name '*.json' | sort)
      - name: Test again with memory checks
        run: |
          cmake -S engine -B engine/build-asan -DLD_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build engine/build-asan -j 4
          ./engine/build-asan/ld_tests

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LoopDraft.apk
      - name: Check the APK
        run: bash android/ci/check_apk.sh LoopDraft.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LoopDraft-apk
          path: LoopDraft.apk

  smoke:
    name: Run the app on an emulator
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LoopDraft-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app and watch it play
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/smoke.sh LoopDraft.apk smoke-out
      - name: Keep screenshots and log (branch ci-smoke)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-out && cd smoke-out
          echo "Smoke test output of run ${{ github.run_number }} (${{ github.sha }})" > README.md
          git init -q && git checkout -q -b ci-smoke && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Smoke test output, run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke

  publish:
    name: Publish latest build
    runs-on: ubuntu-latest
    needs: smoke
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LoopDraft-apk
      - name: Publish as "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest LoopDraft.apk --latest --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built automatically from main. Download LoopDraft.apk on the phone and open it to install. It installs over the previous build and keeps the saved project."

  # The iOS app is a second shell around the same engine. It is built unsigned: installing it on an
  # iPhone or iPad needs a tool that signs it with your own Apple ID (SideStore, Sideloadly, AltStore).
  # This job never blocks the Android build.
  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    needs: engine-tests
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ios/LoopDraft.xcodeproj -scheme LoopDraft -configuration Release -sdk iphoneos \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > xcodebuild.log 2>&1 || { grep -E "error|Undefined|duplicate|ld: |symbol|referenced from" -A6 xcodebuild.log | tail -120; exit 1; }
          tail -3 xcodebuild.log
      - name: Package
        run: |
          mkdir -p ios/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/LoopDraft.app ios/Payload/
          (cd ios && zip -qr ../LoopDraft-iOS-unsigned.ipa Payload)
          ls -lh LoopDraft-iOS-unsigned.ipa
          n=$(unzip -l LoopDraft-iOS-unsigned.ipa | grep -c 'LoopDraft.app/library/.*\.json')
          echo "library files in the app: $n"
          [ "$n" -ge 100 ] || { echo "the content library is missing from the app"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: LoopDraft-ipa
          path: LoopDraft-iOS-unsigned.ipa
      # Starts the app in a simulator and takes pictures of its screens. Shows that it launches and does not crash.
      - name: Run in the simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project ios/LoopDraft.xcodeproj -scheme LoopDraft -configuration Debug -sdk iphonesimulator \
            -derivedDataPath ios/build-sim CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=YES ARCHS=arm64 build \
            > xcodebuild-sim.log 2>&1 || { grep -E "error" -A6 xcodebuild-sim.log | tail -60; exit 1; }
          APP=ios/build-sim/Build/Products/Debug-iphonesimulator/LoopDraft.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'SE' not in x['name']]; print(c[0]['udid'])")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p ios-shots
          fail=0
          shot() {   # shot <name> <launch arguments...>
            name=$1; shift
            xcrun simctl terminate "$UDID" com.loopdraft.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.loopdraft.app "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "ios-shots/$name.png"
            pgrep -f "LoopDraft.app/LoopDraft" > /dev/null || { echo "FAIL: the app is not running after $name"; fail=1; }
          }
          shot 1_drums --tab 0
          shot 2_synth --tab 1
          shot 3_synth_engine --tab 1 --layer 1
          shot 4_fx --tab 2
          shot 5_song --tab 3
          shot 6_menu_library --menu
          shot 7_setup --setup
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "LoopDraft"' --style compact 2>/dev/null | tail -40 > ios-shots/log.txt || true
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: ios-shots
          if-no-files-found: ignore

  publish-ios:
    name: Add the iOS build to the release
    runs-on: ubuntu-latest
    needs: [publish, ios]
    if: github.ref == 'refs/heads/main' && needs.ios.result == 'success'
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LoopDraft-ipa
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload latest LoopDraft-iOS-unsigned.ipa --clobber
