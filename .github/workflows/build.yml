name: Build

on:
  push:
    branches: [main, android-app]
    paths: ['engine/**', 'android/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j 4
          ./engine/build/ld_tests
      - name: Test again with memory checks
        run: |
          cmake -S engine -B engine/build-asan -DLD_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build engine/build-asan -j 4
          ./engine/build-asan/ld_tests

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LoopDraft.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LoopDraft-apk
          path: LoopDraft.apk
      - name: Publish as "Latest build"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest LoopDraft.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built automatically from main. Download LoopDraft.apk on the phone and open it to install. It installs over the previous build and keeps the saved project."
